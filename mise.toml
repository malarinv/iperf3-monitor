# Backends named and versions exact: `uv` and `yq` were `latest`, and `helm`
# was a floating major-less spec that CI did not share — ci.yaml installs
# v3.10.0 while this file declared 3.17.3, so local `mise run chart:lint` and
# the pipeline that runs it were validating two different helm versions.
#
# `aqua:` for helm and yq, matching the other repos in this workspace. The
# `github:` backend cannot name the yq binary `yq` at all on the mise version
# this repo pins, and it mis-extracts helm 3.17.x.
[tools]
"core:python" = "3.12"
"aqua:astral-sh/uv" = "0.13.1"
"aqua:helm/helm" = "3.17.3"
"aqua:mikefarah/yq" = "4.54.1"

[tasks.test]
description = "Run exporter unit tests"
run = "uv run --with-requirements exporter/requirements.txt python -m unittest discover -s exporter -p 'test_*.py'"

[tasks."chart:build"]
description = "Build Helm chart dependencies"
run = "helm dependency build ./charts/iperf3-monitor"

[tasks."chart:lint"]
description = "Lint Helm chart"
run = "helm lint ./charts/iperf3-monitor"
